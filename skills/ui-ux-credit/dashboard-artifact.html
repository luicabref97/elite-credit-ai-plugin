<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu Análisis de Crédito — Elite Credit AI</title>
<!--
  SELF-CONTAINED LIVE-ARTIFACT DASHBOARD (vanilla JS, no React/Babel).
  Ported faithfully from the Claude Design source (elite-credit-ai-report-dashboard):
  direction-a.jsx (interactive dark dashboard, animations via rAF),
  pdf-artboard.jsx + print.css (dedicated light/monochrome/gold PDF layout,
  revealed ONLY on print — window.print() prints the DESIGNED report, not the page),
  styles.css (brand system + context section).
  Single file: CSS inline, JS inline, data embedded. Bilingual ES/EN.
  Data below = real Carly Tarazona audit (v3.3.1 engine run, 1155 evaluations).
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
:root{
  --navy:#0A1628; --navy-2:#16223a; --navy-3:#1a2438;
  --gold:#C4A052; --gold-2:#CDA52C; --gold-soft:#f0e5cc;
  --green:#206540; --green-soft:#5fa87a;
  --red:#B03642; --red-soft:#d97082;
  --bg:#06090f; --bg-2:#0c1220;
  --text:#e6dfce; --text-dim:#98a0b3; --text-faint:#7e87a1; /* V-008: was #5d6680 (3.2:1, AA fail on small text) */
}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding:32px 40px 80px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.brand{font-weight:700;letter-spacing:-.3px;font-size:15px;color:var(--gold-soft)}
.brand span{color:var(--gold)}
.lang-toggle{display:flex;gap:2px;background:var(--bg-2);border:1px solid var(--navy-3);border-radius:8px;padding:3px}
.lang-toggle button{background:none;border:none;color:var(--text-dim);font-family:inherit;font-size:12px;font-weight:600;
  padding:5px 12px;border-radius:6px;cursor:pointer;transition:.2s}
.lang-toggle button.active{background:var(--gold);color:var(--navy)}
/* hero */
.hero{margin-bottom:48px}
.hero-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.flow-chip{font-size:11px;font-weight:600;letter-spacing:2px;color:var(--gold);text-transform:uppercase}
.flow-chip .dot{margin:0 8px;color:var(--text-faint)}
.audit-date{font-size:12px;color:var(--text-faint);font-variant-numeric:tabular-nums}
.hero-grid{display:grid;grid-template-columns:1fr auto;gap:32px;align-items:center;margin-bottom:40px}
.greeting{font-size:46px;font-weight:700;letter-spacing:-1.5px;line-height:1.08;color:var(--gold-soft);max-width:620px;text-wrap:balance}
.summary{margin-top:16px;font-size:15px;color:var(--text-dim);max-width:600px}
.summary strong{color:var(--gold-soft)}.summary em{color:var(--red-soft);font-style:normal}
.impact-card{background:linear-gradient(160deg,var(--navy-2),var(--navy));border:1px solid var(--navy-3);
  border-radius:18px;padding:24px 28px;text-align:center;min-width:200px}
.impact-card .lbl{font-size:10px;font-weight:600;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase}
.impact-card .val{font-size:40px;font-weight:800;color:var(--gold);letter-spacing:-1px;margin-top:6px;font-variant-numeric:tabular-nums}
.impact-card .val .arrow{color:var(--text-faint);font-size:24px;margin:0 4px;vertical-align:middle}
.impact-card .unit{font-size:11px;color:var(--text-dim);margin-top:4px}
.scores-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.score-card{background:var(--navy);border:1px solid var(--navy-3);border-radius:14px;padding:18px 12px 8px;display:flex;flex-direction:column;align-items:center}
.sc-bureau{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--text-dim);text-transform:uppercase;margin-bottom:2px}
/* sections */
.section{margin-top:44px}
.sec-head{margin-bottom:20px}
.sec-head h2{font-size:22px;font-weight:600;letter-spacing:-.4px;color:var(--gold-soft)}
.sec-head p{font-size:13px;color:var(--text-dim);margin-top:3px}
.sec-head.split{display:flex;justify-content:space-between;align-items:flex-end}
/* factor donut */
.factors{display:grid;grid-template-columns:auto 1fr;gap:32px;align-items:center;background:var(--navy);
  border:1px solid var(--navy-3);border-radius:16px;padding:28px}
.donut-wrap{cursor:pointer}
.donut-wrap svg{display:block;width:min(380px,100%);height:auto}
.score-card svg{display:block;width:min(300px,100%);height:auto}
.fsd-side{border:1px solid var(--navy-3);border-radius:14px;padding:22px;min-height:240px}
.fsd-side h3{font-size:16px;color:var(--gold-soft);margin-bottom:8px}
.fsd-side .intro-p{font-size:13px;color:var(--text-dim)}
.fsd-side-head{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.fsd-grade{width:48px;height:48px;border:2px solid;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;flex-shrink:0}
.fsd-name{font-size:16px;font-weight:600;color:var(--text)}
.fsd-meta{font-size:12px;color:var(--text-dim)}.fsd-meta .d{margin:0 6px;color:var(--text-faint)}
.fsd-text{font-size:13px;color:var(--text-dim);margin-bottom:16px}
.fsd-list{display:flex;flex-direction:column;gap:4px}
.fsd-item{display:flex;align-items:center;gap:10px;background:none;border:none;border-radius:8px;padding:8px 10px;cursor:pointer;font-family:inherit;text-align:left;transition:.15s}
.fsd-item:hover,.fsd-item.active{background:var(--bg-2)}
.fsd-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.fsd-li-name{flex:1;font-size:13px;color:var(--text)}
.fsd-li-grade{font-size:13px;font-weight:700}
.fsd-li-weight{font-size:12px;color:var(--text-dim);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
/* accounts master/detail */
.shelf{display:grid;grid-template-columns:300px 1fr;gap:18px}
.shelf-list{display:flex;flex-direction:column;gap:6px;max-height:520px;overflow-y:auto;padding-right:4px}
.acct-chip{display:flex;flex-direction:column;gap:3px;background:none;border:1px solid var(--navy-3);border-radius:10px;
  padding:11px 14px;cursor:pointer;font-family:inherit;text-align:left;transition:.15s}
.acct-chip:hover{border-color:var(--gold)}
.acc-creditor{font-size:13px;font-weight:600;color:var(--text)}
.acc-status{font-size:11px}
.shelf-detail{border:1px solid var(--navy-3);border-radius:14px;padding:24px}
.sd-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;gap:16px}
.sd-creditor{font-size:19px;font-weight:700;color:var(--gold-soft)}
.sd-type{font-size:12px;color:var(--text-dim);margin-top:2px}
.sd-status{font-size:12px;font-weight:600;border:1px solid;border-radius:8px;padding:6px 12px;text-align:right;flex-shrink:0}
.sd-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 20px;margin-bottom:20px}
.sd-grid dt{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-faint)}
.sd-grid dd{font-size:14px;color:var(--text);margin-top:2px;font-variant-numeric:tabular-nums}
.sd-bureaus{display:flex;flex-direction:column;gap:1px;background:var(--navy-3);border-radius:10px;overflow:hidden;margin-bottom:16px}
.sd-bureau{display:grid;grid-template-columns:1fr auto auto;gap:16px;align-items:center;background:var(--bg-2);padding:10px 16px}
.sdb-name{font-size:13px;color:var(--text-dim)}
.sdb-bal{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.sdb-stat{font-size:12px;color:var(--text-dim)}
.sd-flags{display:flex;flex-wrap:wrap;gap:6px}
.sd-flag{font-size:11px;color:var(--gold);background:rgba(196,160,82,.1);border:1px solid rgba(196,160,82,.25);border-radius:6px;padding:3px 9px}
/* anomalies */
.filter-chips{display:flex;gap:8px;margin-top:12px;margin-bottom:18px}
.chip{background:var(--bg-2);border:1px solid var(--navy-3);border-radius:8px;color:var(--text-dim);
  font-family:inherit;font-size:12px;font-weight:600;padding:6px 14px;cursor:pointer;transition:.15s}
.chip.active{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.chip .n{opacity:.7;margin-left:3px}
.anomaly-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.anomaly{background:var(--navy);border:1px solid var(--navy-3);border-left:3px solid;border-radius:12px;padding:18px 20px}
.an-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.an-sev{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;border:1px solid;border-radius:6px;padding:2px 8px}
.an-cite{font-size:11px;color:var(--text-faint);font-variant-numeric:tabular-nums}
.an-title{font-size:15px;font-weight:600;color:var(--gold-soft);margin-bottom:6px}
.an-explain{font-size:13px;color:var(--text-dim);margin-bottom:12px}
.an-affected{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.an-chip{font-size:11px;color:var(--text-dim);background:var(--bg-2);border-radius:6px;padding:3px 9px}
.an-action{border-top:1px solid var(--navy-3);padding-top:10px}
.an-action-lbl{display:block;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--green-soft);margin-bottom:3px}
.an-action-text{font-size:13px;color:var(--text)}
/* action plan timeline */
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tl-phase{background:var(--navy);border:1px solid var(--navy-3);border-radius:12px;padding:16px}
.tl-phase-head{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.tl-step{display:flex;gap:10px;margin-bottom:14px}
.tl-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);margin-top:5px;flex-shrink:0}
.tl-action{font-size:13px;font-weight:500;color:var(--text);margin-bottom:2px}
.tl-reason{font-size:11px;color:var(--text-dim)}
.tl-effort{font-size:11px;color:var(--gold);margin-top:3px}
.impact-pill{background:rgba(196,160,82,.08);border:1px solid rgba(196,160,82,.3);border-radius:20px;padding:8px 18px;text-align:right}
.ip-label{display:block;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-dim)}
.ip-value{font-size:14px;font-weight:700;color:var(--gold)}
/* context section — ported from styles.css:285-295 */
.context-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.ctx-card{background:var(--navy);border:1px solid var(--navy-3);border-radius:10px;padding:16px}
.ctx-creditor{font-weight:600;font-size:13px;color:var(--gold-soft);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--navy-3)}
.ctx-rows{display:flex;flex-direction:column;gap:8px;font-size:12px}
.ctx-rows>div{display:flex;flex-direction:column;gap:2px}
.ctx-lbl{font-size:10px;color:var(--text-faint);letter-spacing:.5px;text-transform:uppercase}
.ctx-val{color:var(--text-dim)}
.ctx-val.pending{color:var(--text-faint);font-style:italic}
.ctx-add{display:flex;align-items:center;justify-content:center;background:none;border:1px dashed var(--navy-3);
  border-radius:10px;color:var(--text-dim);font-family:inherit;font-size:13px;font-weight:600;padding:16px;cursor:pointer;transition:.15s;min-height:120px}
.ctx-add:hover{border-color:var(--gold);color:var(--gold)}
/* footer */
.footer{margin-top:48px;border-top:1px solid var(--navy-3);padding-top:24px}
.footer-actions{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.btn-gold{background:var(--gold);color:var(--navy);border:none;border-radius:10px;font-family:inherit;font-size:14px;font-weight:700;padding:12px 24px;cursor:pointer}
.btn-ghost{background:none;color:var(--text);border:1px solid var(--navy-3);border-radius:10px;font-family:inherit;font-size:14px;font-weight:600;padding:12px 24px;cursor:pointer}
.btn-ghost:hover{border-color:var(--gold)}
.disclaimer{font-size:12px;color:var(--text-faint);max-width:680px}
.disclaimer a{color:var(--gold)}
@media(max-width:900px){
  .hero-grid,.scores-row,.factors,.shelf,.anomaly-grid,.timeline,.context-grid{grid-template-columns:1fr}
  .wrap{padding:20px}
}
@media(pointer:coarse){ /* V-010: 44px touch targets where copy invites touch */
  .lang-toggle button{min-height:44px;padding:10px 16px}
  .chip{min-height:44px;padding:10px 16px}
  .fsd-item{min-height:44px}
  .acct-chip{min-height:48px}
}

/* ============================================================
   DEDICATED PDF ARTBOARD — ported from pdf-artboard.jsx + styles.css:677-729.
   Hidden on screen; revealed ONLY during print (print.css pattern).
   ============================================================ */
.pdf-render-host{display:none}
.pdf-page{background:#fff;color:#14191e;font-family:'Plus Jakarta Sans',system-ui,sans-serif;line-height:1.5}
.pdf-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.pdf-brand{font-weight:800;letter-spacing:4px;font-size:14px;color:#846720}
.pdf-meta{text-align:right;font-size:12px}
.pdf-meta-sub{font-size:10px;color:#777;letter-spacing:.5px;margin-top:2px}
.pdf-rule{height:2px;background:#846720;margin:10px 0 24px}
.pdf-section{margin-bottom:28px}
.pdf-section h2{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#846720;margin-bottom:12px;font-weight:700}
.pdf-scores{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pdf-score{border:1px solid #d8c98a;border-radius:4px;padding:14px;text-align:center}
.pdf-score-bureau{font-size:10px;color:#888;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
.pdf-score-num{font-size:36px;font-weight:700;color:#1a1a1a;letter-spacing:-1px}
.pdf-score-grade{font-size:11px;color:#846720;letter-spacing:1px;margin-top:4px}
.pdf-table{width:100%;border-collapse:collapse;font-size:11px}
.pdf-table th{text-align:left;padding:8px 12px;background:#f0e9d6;color:#5a4a18;font-weight:700;letter-spacing:.5px;border-bottom:1px solid #d8c98a}
.pdf-table td{padding:8px 12px;border-bottom:1px solid #ece4d0;vertical-align:top}
.pdf-table .pdf-grade{font-weight:700;color:#846720}
.pdf-anomaly{margin-bottom:18px;padding:14px 16px;background:#f5f0e0;border-left:3px solid #846720;border-radius:2px}
.pdf-an-head{display:flex;gap:10px;align-items:center;margin-bottom:6px;font-size:10px}
.pdf-an-num{font-weight:700;color:#846720}
.pdf-an-sev{font-weight:700;letter-spacing:1px;padding:1px 6px;border-radius:2px}
.pdf-an-sev.sev-HIGH{background:#f3d6d8;color:#7a1a22}
.pdf-an-sev.sev-MEDIUM{background:#f0e2b5;color:#5a4a18}
.pdf-an-sev.sev-LOW{background:#d8eede;color:#1a4d2c}
.pdf-an-cite{color:#999}
.pdf-anomaly h3{font-size:13px;margin-bottom:6px;color:#1a1a1a;font-weight:600}
.pdf-anomaly p{font-size:11px;color:#444;margin-bottom:6px}
.pdf-an-action{font-size:10px;color:#5a4a18}
.pdf-plan-impact{font-size:12px;color:#1a1a1a;margin-bottom:14px;padding:10px 14px;background:#f0e9d6;border-radius:3px}
.pdf-plan-block{margin-bottom:14px}
.pdf-plan-block h3{font-size:11px;color:#846720;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.pdf-plan-block ul{margin:0;padding:0;list-style:none}
.pdf-plan-block li{padding:8px 0;border-bottom:1px dashed #d8c98a}
.pdf-plan-block li>*{display:block}
.pdf-plan-block li strong{font-size:12px;color:#1a1a1a}
.pdf-plan-reason{font-size:11px;color:#555;margin-top:2px}
.pdf-plan-effort{font-size:10px;color:#888;letter-spacing:.5px;margin-top:2px}
.pdf-foot{margin-top:32px}
.pdf-foot p{font-size:10px;color:#666;line-height:1.55;margin-bottom:6px}
.pdf-foot-meta{font-size:9px;color:#999;letter-spacing:.5px}

/* print swap — ported from print.css: hide the dark interactive dashboard,
   reveal ONLY the designed PDF artboard. */
@page{size:letter;margin:.5in}
@media print{
  html,body{background:#fff !important;color:#14191e !important}
  .wrap>.topbar,.wrap>.hero,.wrap>.section,.wrap>.footer{display:none !important}
  .pdf-render-host{display:block !important}
  .pdf-page{margin:0 !important;padding:0 !important;width:100% !important;box-shadow:none !important}
  .pdf-section,.pdf-anomaly,.pdf-plan-block{break-inside:avoid}
  .pdf-table{break-inside:auto}
  .pdf-table tr{break-inside:avoid;break-after:auto}
}
</style>
</head>

// ============ SCORE GAUGE (SVG) — animation per direction-a.jsx ScoreGaugeA ============
function scoreGauge(s,p){
  const cx=160,cy=170,r=130,stroke=22;
  const pct=Math.max(0,Math.min(1,(s.score-300)/550));
  const shown=Math.round(300+(s.score-300)*p);   // count-up 300 → score
  const fill=pct*p;                               // arc fills progressively
  const gap=.008;
  const segs=[[0,.508-gap,"#D24F66"],[.508,.671-gap,"#E08A3C"],[.671,.798-gap,"#E8C547"],[.798,.907-gap,"#A8C957"],[.907,1,"#5FB97D"]];
  const arcPath=(a,b)=>{if(b<=a)return"";const A=Math.PI-Math.PI*a,B=Math.PI-Math.PI*b;const x1=cx+r*Math.cos(A),y1=cy-r*Math.sin(A),x2=cx+r*Math.cos(B),y2=cy-r*Math.sin(B);return `M ${x1} ${y1} A ${r} ${r} 0 ${b-a>.5?1:0} 1 ${x2} ${y2}`;};
  const angle=Math.PI-Math.PI*fill,dotX=cx+r*Math.cos(angle),dotY=cy-r*Math.sin(angle); // dot rides the animated arc
  const color=gradeColor(s.grade);
  const gLabel={POOR:t("POBRE","POOR"),FAIR:t("REGULAR","FAIR"),GOOD:t("BUENO","GOOD"),VERY_GOOD:t("MUY BUENO","VERY GOOD"),EXCELLENT:t("EXCELENTE","EXCELLENT")}[s.grade]||s.grade;
  let bg="",fg="";
  segs.forEach(([a,b,c])=>{bg+=`<path d="${arcPath(a,b)}" fill="none" stroke="${c}" stroke-width="${stroke}" stroke-linecap="round" opacity=".16"/>`;const fe=Math.min(b,fill);if(fe>a)fg+=`<path d="${arcPath(a,fe)}" fill="none" stroke="${c}" stroke-width="${stroke}" stroke-linecap="round"/>`;});
  return `<svg width="300" height="190" viewBox="0 0 320 200" role="img" aria-label="${s.score} · ${gLabel}">${bg}${fg}
    <circle cx="${dotX}" cy="${dotY}" r="11" fill="#0c1220" stroke="${color}" stroke-width="3"/>
    <circle cx="${dotX}" cy="${dotY}" r="4" fill="#f0e5cc"/>
    <text x="${cx}" y="${cy-32}" text-anchor="middle" fill="#f0e5cc" font-size="62" font-weight="700" letter-spacing="-2">${shown}</text>
    ${(()=>{const isFirst=s.delta===0;const dc=isFirst?"#5fb97d":(s.delta<0?"#d97082":"#5fb97d");
      return `<g transform="translate(${cx+70}, ${cy-56})">${isFirst?"":`<text fill="${dc}" font-size="11" font-weight="700" text-anchor="start" dominant-baseline="middle">${s.delta>0?"▲":"▼"}</text>`}<text y="${isFirst?0:15}" fill="${dc}" font-size="12" font-weight="600" text-anchor="start" dominant-baseline="middle" style="font-variant-numeric:tabular-nums">${isFirst?"0":Math.abs(s.delta)}</text></g>`;})()}
    <text x="${cx}" y="${cy-10}" text-anchor="middle" fill="#98a0b3" font-size="11" letter-spacing="2.5" font-weight="500">${s.model==="VS 3.0"?"VANTAGE SCORE 3.0":s.model}</text>
    <text x="${cx}" y="${cy+22}" text-anchor="middle" fill="${color}" font-size="22" font-weight="700" letter-spacing="3">${gLabel}</text></svg>`;
}

// ============ FACTOR DONUT (SVG) — grow animation per FactorScoreDonut ============
// V-006: design's short names (direction-a.jsx:142-148) — not naive first-word split
const FACTOR_SHORT={"Payment History":{es:"PAGOS",en:"PAYMENT"},"Amounts Owed":{es:"DEUDA",en:"OWED"},"Length of Credit":{es:"ANTIGÜEDAD",en:"LENGTH"},"New Credit":{es:"NUEVO",en:"NEW"},"Credit Mix":{es:"MEZCLA",en:"MIX"}};
function factorDonut(p){
  const F=AUDIT_DATA.factor_grades,cx=200,cy=200,ri=108,ro=178,gap=.022;
  const total=F.reduce((s,f)=>s+f.weight_vs,0);let cur=-Math.PI/2;
  // cursor advances by FULL span; each segment grows within its slot (matches React source)
  const segs=F.map((f,i)=>{const fullSpan=(f.weight_vs/total)*Math.PI*2;const span=fullSpan*p;
    const start=cur+gap/2,end=Math.max(start+.001,cur+span-gap/2);cur+=fullSpan;
    return{...f,start,end,mid:(start+end)/2,idx:i};});
  const sector=(s,e)=>{const pp=(r,a)=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];const[ax,ay]=pp(ro,s),[bx,by]=pp(ro,e),[ex,ey]=pp(ri,e),[fx,fy]=pp(ri,s);const lg=e-s>Math.PI?1:0;return `M ${ax} ${ay} A ${ro} ${ro} 0 ${lg} 1 ${bx} ${by} L ${ex} ${ey} A ${ri} ${ri} 0 ${lg} 0 ${fx} ${fy} Z`;};
  const rMid=(ri+ro)/2;
  let paths="";
  segs.forEach((seg,i)=>{const c=gradeColor(seg.grade),op=SEL_FACTOR===null||SEL_FACTOR===i?1:.32;const lx=cx+rMid*Math.cos(seg.mid),ly=cy+rMid*Math.sin(seg.mid);
    paths+=`<g onclick="event.stopPropagation();selectFactor(${i})" style="cursor:pointer">
      <path d="${sector(seg.start,seg.end)}" fill="${c}" opacity="${op}" stroke="${SEL_FACTOR===i?'#f0e5cc':'none'}" stroke-width="${SEL_FACTOR===i?1.5:0}" style="transition:opacity .25s"/>
      <text x="${lx}" y="${ly-2}" text-anchor="middle" fill="#0c1220" font-size="22" font-weight="800" pointer-events="none">${seg.grade}</text>
      <text x="${lx}" y="${ly+14}" text-anchor="middle" fill="#0c1220" font-size="9" font-weight="700" opacity=".85" pointer-events="none">${(FACTOR_SHORT[seg.factor_en]?FACTOR_SHORT[seg.factor_en][LANG==="en"?"en":"es"]:(LANG==="en"?seg.factor_en:seg.factor_es).split(" ")[0].toUpperCase())}</text></g>`;});
  let center;
  if(SEL_FACTOR!==null){const sf=F[SEL_FACTOR];center=`<text x="${cx}" y="${cy-30}" text-anchor="middle" fill="#7a8499" font-size="10" letter-spacing="2">${t("PESO","WEIGHT")}</text><text x="${cx}" y="${cy+18}" text-anchor="middle" fill="${gradeColor(sf.grade)}" font-size="52" font-weight="700" letter-spacing="-2">${sf.weight_vs}%</text>`;}
  else center=`<text x="${cx}" y="${cy-4}" text-anchor="middle" fill="#98a0b3" font-size="11" letter-spacing="2" font-weight="600">${t("5 FACTORES","5 FACTORS")}</text><text x="${cx}" y="${cy+16}" text-anchor="middle" fill="#5d6680" font-size="10">${t("Haz click para explorar","Click any to explore")}</text>`;
  return `<svg width="380" height="400" viewBox="0 0 400 400" aria-hidden="true" onclick="selectFactor(null)"><rect width="400" height="400" fill="transparent"/>${paths}${center}</svg>`;
}
function factorSide(){

    head=`<div class="fsd-side-head"><div class="fsd-grade" style="color:${c};border-color:${c}">${sf.grade}</div><div><div class="fsd-name">${t(sf.factor_es,sf.factor_en)}</div><div class="fsd-meta"><span style="color:${c}">${sf.weight_vs}%</span><span class="d">·</span>${t("de tu score","of your score")}</div></div></div>`;

  let list=F.map((f,i)=>`<button class="fsd-item ${i===SEL_FACTOR?'active':''}" aria-pressed="${i===SEL_FACTOR}" data-fid="fsd-${i}" onclick="selectFactor(${i})"><span class="fsd-dot" style="background:${gradeColor(f.grade)}"></span><span class="fsd-li-name">${t(f.factor_es,f.factor_en)}</span><span class="fsd-li-grade" style="color:${gradeColor(f.grade)}">${f.grade}</span><span class="fsd-li-weight">${f.weight_vs}%</span></button>`).join("");

  const rows=[["eq","Equifax"],["ex","Experian"],["tu","TransUnion"]].map(([k,n])=>`<div class="sd-bureau"><span class="sdb-name">${n}</span><span class="sdb-bal">${money(a.balance[k])}</span><span class="sdb-stat" style="color:${bureauStatusColor(a.status_per_bureau[k])}">${statusLabel(a.status_per_bureau[k])}</span></div>`).join("");

  if(a.utilization!=null)grid.push([t("Uso","Utilization"),`<span style="color:${a.utilization>30?'#C4A052':'#5fa87a'}">${a.utilization}%</span>`]);
  if(a.original_creditor)grid.push([t("Original","Original"),a.original_creditor]);
  const gridH=grid.map(([l,v])=>`<div><dt>${l}</dt><dd>${v}</dd></div>`).join("");
  const flags=a.flags.length?`<div class="sd-flags">${a.flags.map(f=>`<span class="sd-flag">${flagLabel(f)}</span>`).join("")}</div>`:"";
  return `<div class="shelf"><div class="shelf-list">${list}</div>
    <div class="shelf-detail" style="border-color:${c.border}">
      <div class="sd-head"><div><div class="sd-creditor">${a.creditor}</div><div class="sd-type">${t(a.type_es,a.type_en)}</div></div>
        <div class="sd-status" style="color:${c.text};border-color:${c.border}">${t(a.friendly_status_es,a.friendly_status_en)}</div></div>
      <div class="sd-grid">${gridH}</div><div class="sd-bureaus">${rows}</div>${flags}</div></div>`;
}

// ============ ANOMALIES ============
function anomalies(){
  const list=FILTER==="all"?AUDIT_DATA.anomalies:AUDIT_DATA.anomalies.filter(a=>a.severity===FILTER);
  const counts={all:AUDIT_DATA.anomalies.length,HIGH:AUDIT_DATA.anomalies.filter(a=>a.severity==="HIGH").length,MEDIUM:AUDIT_DATA.anomalies.filter(a=>a.severity==="MEDIUM").length};
  const chips=[["all",t("Todos","All"),counts.all],["HIGH",t("Críticos","Critical"),counts.HIGH],["MEDIUM",t("Medianos","Medium"),counts.MEDIUM]].map(([k,l,n])=>`<button class="chip ${FILTER===k?'active':''}" aria-pressed="${FILTER===k}" data-fid="chip-${k}" onclick="setFilter('${k}')">${l}<span class="n">${n}</span></button>`).join("");
  const cards=list.map(a=>{const sc={HIGH:"#B03642",MEDIUM:"#C4A052",LOW:"#5fa87a"}[a.severity],sl={HIGH:t("Crítico","Critical"),MEDIUM:t("Mediano","Medium"),LOW:t("Menor","Minor")}[a.severity];
    return `<div class="anomaly" style="border-left-color:${sc}"><div class="an-head"><span class="an-sev" style="color:${sc};border-color:${sc}">${sl}</span><span class="an-cite">${a.citation}</span></div>
      <h3 class="an-title">${t(a.title_es,a.title_en)}</h3><p class="an-explain">${t(a.explanation_es,a.explanation_en)}</p>
      <div class="an-affected">${a.affected.map(x=>`<span class="an-chip">${x}</span>`).join("")}</div>
      <div class="an-action"><span class="an-action-lbl">${t("Lo que vamos a hacer","What we'll do")}</span><span class="an-action-text">${t(a.action_es,a.action_en)}</span></div></div>`;}).join("");
  return `<div class="filter-chips">${chips}</div><div class="anomaly-grid">${cards}</div>`;
}

// ============ ACTION PLAN ============
function actionPlan(){
  const P=AUDIT_DATA.action_plan;

}

// ============ CONTEXT SECTION — ported from direction-a.jsx "Your context" ============
function contextSection(){

// ============ ENTRANCE ANIMATIONS — rAF, same durations/easing as the React source ============
// ScoreGaugeA: 1500ms count-up + arc fill + dot travel. FactorScoreDonut: 1300ms grow.
function animateIn(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){GAUGE_P=1;DONUT_P=1;render();return;}
  const D=AUDIT_DATA, t0=performance.now();
  const GAUGE_MS=1500, DONUT_MS=1300;
  function frame(now){
    const gp=Math.min(1,(now-t0)/GAUGE_MS), dp=Math.min(1,(now-t0)/DONUT_MS);
    GAUGE_P=easeOut(gp); DONUT_P=easeOut(dp);
    [["equifax"],["experian"],["transunion"]].forEach(([k])=>{const el=document.getElementById("gauge-"+k);if(el)el.innerHTML=scoreGauge(D.scores[k],GAUGE_P);});
    const dh=document.getElementById("donut-host");if(dh)dh.innerHTML=factorDonut(DONUT_P);
    if(gp<1||dp<1)requestAnimationFrame(frame);else{GAUGE_P=1;DONUT_P=1;}
  }
  GAUGE_P=0;DONUT_P=0;
  [["equifax"],["experian"],["transunion"]].forEach(([k])=>{const el=document.getElementById("gauge-"+k);if(el)el.innerHTML=scoreGauge(D.scores[k],0);});
  const dh=document.getElementById("donut-host");if(dh)dh.innerHTML=factorDonut(0);
  requestAnimationFrame(frame);
}

function setLang(l){LANG=l;render();}   // no entrance replay on toggle — animation runs once on load
function selectFactor(i){SEL_FACTOR=i;render();}     // interaction re-renders fully drawn (no replay)
function selectAcct(i){SEL_ACCT=i;render();}
function setFilter(f){FILTER=f;render();}
render();
animateIn();
</script>
