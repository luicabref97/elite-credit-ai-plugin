<!doctype html>
<!--
  Direct PDF artboard — opens the print-friendly layout immediately.
  Useful when the consumer prefers the printable version from the start, or
  when the runtime "Descargar PDF" button opens this URL with autoprint.
  Reads ?lang=es|en (default es) and ?autoprint=1 to trigger window.print() on load.
-->
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Reporte de crédito (PDF) · Elite Credit AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="styles-extras.css">
  <link rel="stylesheet" href="print.css">
  <style>
    html, body { background: #ffffff; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="data.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="pdf-artboard.jsx"></script>

  <script type="text/babel">
    const params = new URLSearchParams(window.location.search);
    const lang = (params.get("lang") === "en") ? "en" : "es";
    const autoprint = params.get("autoprint") === "1";
    document.documentElement.lang = lang;

    ReactDOM.createRoot(document.getElementById("root"))
      .render(<window.PDFArtboard lang={lang} />);

    if (autoprint) {
      // Wait for fonts + render then trigger print.
      window.addEventListener("load", () => {
        setTimeout(() => window.print(), 800);
      });
    }
  </script>
</body>
</html>
